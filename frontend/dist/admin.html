<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ადმინ პანელი — ChatAssist</title>
  <link rel="icon" type="image/svg+xml" href="/panel/favicon.svg" />
  <style>
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: var(--shadow-sm); }
    .stat .val { font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; }
    .stat .lbl { font-size: .82rem; color: var(--muted); margin-top: 2px; }
    .admin-table-wrap { overflow-x: auto; }
    table.admin { width: 100%; border-collapse: collapse; font-size: .9rem; }
    table.admin th, table.admin td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    table.admin th { color: var(--muted); font-weight: 600; font-size: .82rem; }
    table.admin tr:hover td { background: var(--bg); }
    .pill { display: inline-block; font-size: .72rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
    .pill-on { background: #dcfce7; color: var(--ok); }
    .pill-off { background: #f1f5f9; color: var(--muted); }
    select.tier-sel { width: auto; padding: 6px 8px; border-radius: 8px; font-size: .85rem; }
    .req-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .req-row:last-child { border-bottom: none; }
    .muted { color: var(--muted); font-size: .85rem; }
    .chart { display: flex; align-items: flex-end; gap: 10px; height: 160px; padding-top: 10px; }
    .chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 5px; }
    .chart-bars { display: flex; align-items: flex-end; gap: 4px; height: 100%; }
    .chart-bars .bar { width: 14px; border-radius: 4px 4px 0 0; min-height: 2px; transition: height .3s ease; }
    .bar.orders { background: linear-gradient(180deg, #34d399, #059669); }
    .bar.shops { background: linear-gradient(180deg, #6ee7d7, #14b8a6); }
    .chart-lbl { font-size: .72rem; color: var(--muted); }
    .chart-legend { display: flex; gap: 18px; font-size: .82rem; color: var(--muted); margin-top: 10px; }
    .chart-legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
    .stat.mrr { background: linear-gradient(135deg, #10b981, #047857); color: #fff; }
    .stat.mrr .lbl { color: rgba(255,255,255,.85); }
    .row-actions { display: flex; gap: 6px; }
    .icon-btn { cursor: pointer; border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 5px 9px; font-size: .85rem; }
    .icon-btn:hover { background: var(--bg); }
    .icon-btn.danger { color: var(--danger); border-color: var(--danger); }
    .icon-btn.danger:hover { background: var(--danger); color: #fff; }
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5); display: flex; align-items: flex-start; justify-content: center; padding: 30px 16px; z-index: 200; overflow-y: auto; }
    .modal { background: #fff; border-radius: var(--radius); max-width: 720px; width: 100%; padding: 20px; box-shadow: var(--shadow-md); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .modal-head h2 { margin: 0; }
    @media (max-width: 700px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
  <script type="module" crossorigin src="/panel/assets/admin-u71pt8ct.js"></script>
  <link rel="modulepreload" crossorigin href="/panel/assets/jsx-runtime-BEumusn6.js">
  <link rel="modulepreload" crossorigin href="/panel/assets/dist-BJEDHNZ-.js">
  <link rel="stylesheet" crossorigin href="/panel/assets/dist-dqS4cBvI.css">
</head>
<body>
  <div id="root"></div>

  <!-- ⚠️ config.js კლასიკური სკრიპტია და module-მდე სრულდება (module ყოველთვის deferred-ია),
       ამიტომ წესი: window.APP_CONFIG მზადაა React-ის ჩატვირთვისას. რიგითობა არ შეცვალო. -->
  <script src="/panel/config.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>შეკვეთა</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="toast" class="toast hidden"></div>

  <main class="container" style="max-width:560px">
    <div class="card">
      <h1 id="shop-name" style="margin-top:0">იტვირთება...</h1>
      <p class="import-hint">აირჩიე პროდუქტები, მიუთითე რაოდენობა და შეავსე მონაცემები.</p>
    </div>

    <form id="order-form">
      <div class="card">
        <h2 style="margin-top:0">პროდუქტები</h2>
        <div id="product-list" class="product-list"></div>
        <p id="empty-products" class="empty-state hidden">ამ მაღაზიას ამჟ ამად პროდუქტი არ აქვს.</p>
      </div>

      <div class="card">
        <h2 style="margin-top:0">შენი მონაცემები</h2>
        <label>სახ ელი *
          <input type="text" id="c-name" required placeholder="სახ ელი გვარი" />
        </label>
        <label>ტელეფონი *
          <input type="tel" id="c-phone" required placeholder="5XX XX XX XX" />
        </label>
        <label>მისამართი *
          <input type="text" id="c-address" required placeholder="ქალაქი, ქუჩა, ბინა" />
        </label>
        <label>კომენტარი (არასავალდებულო)
          <textarea id="c-note" rows="2" placeholder="დამატებითი ინფორმაცია"></textarea>
        </label>
      </div>

      <div class="card">
        <div class="list-header">
          <h2 style="margin:0">ჯამი: <span id="total">0</span> ₾</h2>
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%">
          შეკვეთის გაგზავნა
        </button>
      </div>
    </form>

    <div id="success" class="card hidden" style="text-align:center">
      <h2 style="color:var(--ok)">✅ შეკვეთა მიღებულია!</h2>
      <p>მადლობა! გამყიდველი მალე დაგიკავშირდებათ.</p>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="order.js"></script>
</body>
</html>

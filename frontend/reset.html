<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>პაროლის აღდგენა</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="toast" class="toast hidden"></div>

  <main class="container">
    <div class="auth-view">
      <div class="card auth-card">
        <h1 class="auth-title"><span class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 8h14l-1.1 11.2A2.5 2.5 0 0 1 15.4 21.5H8.6A2.5 2.5 0 0 1 6.1 19.2L5 8z" fill="#fff"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg></span> ახალი პაროლი</h1>

        <div id="reset-loading" class="import-hint">ბმული მოწმდება...</div>

        <form id="reset-form" class="auth-form hidden">
          <label>ახალი პაროლი (მინ. 6 სიმბოლო)
            <input type="password" id="new-password" required minlength="6" autocomplete="new-password" placeholder="••••••••" />
          </label>
          <label>გაიმეორე პაროლი
            <input type="password" id="new-password2" required minlength="6" autocomplete="new-password" placeholder="••••••••" />
          </label>
          <button type="submit" class="btn btn-primary">პაროლის შენახვა</button>
        </form>

        <div id="reset-error" class="import-result import-err hidden"></div>

        <div id="reset-success" class="hidden" style="text-align:center">
          <p style="color:var(--ok);font-weight:600">✅ პაროლი შეიცვალა!</p>
          <a href="index.html" class="btn btn-primary" style="display:inline-block">შესვლა</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="reset.js?v=2"></script>
</body>
</html>

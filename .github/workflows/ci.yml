name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.3"
      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock.txt
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Dependency check
        run: pip check
      - name: Vulnerability audit
        run: pip install pip-audit && pip-audit -r requirements.lock.txt --no-deps --disable-pip
      - name: Compile check
        run: python -m compileall -q app
      - name: Lint
        run: ruff check app tests
      - name: Tests
        run: pytest -q --cov=app.api.admin --cov=app.api.shops --cov-report=term-missing:skip-covered
      - name: Coverage gate (api/admin.py, api/shops.py >= 85%)
        run: |
          coverage report --include=app/api/admin.py --fail-under=85
          coverage report --include=app/api/shops.py --fail-under=85

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Vulnerability audit (prod deps)
        run: npm audit --omit=dev
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: dist is up to date
        run: git diff --exit-code -- dist
